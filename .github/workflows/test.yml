name: test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        lua-version:
          - "5.1.:latest"
          - "5.2.:latest"
          - "5.3.:latest"
          - "5.4.:latest"
          - "lj-v2.1:latest"

    runs-on: ${{ matrix.os }}

    steps:
    -
      name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: 'true'
    -
      name: Setup Lua ${{ matrix.lua-version }}
      uses: mah0x211/setup-lua@v1
      with:
        versions: ${{ matrix.lua-version }}
    -
      name: Install dependencies for macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install lcov pcre2
        BREW_PREFIX=$(brew --prefix)
        echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig" >> "$GITHUB_ENV"
    -
      name: Install dependencies for Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt install lcov -y
    -
      name: Install
      run: |
        KQUEUE_COVERAGE=1 luarocks make
    -
      name: Install Tools
      run: |
        luarocks install testcase
        luarocks install io-fileno
        luarocks install errno
        luarocks install signal
        luarocks install os-pipe
    -
      name: Run Test
      run: |
        testcase ./test/
    -
      name: Generate coverage reports
      run: |
        sh ./covgen.sh
    -
      name: Upload c coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        flags: unittests
